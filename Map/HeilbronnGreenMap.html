 if(!h){tip.style.display="none";return}tip.innerHTML=h;tip.style.display="block";const o=e.originalEvent;tip.style.left=Math.min(o.clientX+14,innerWidth-250)+"px";tip.style.top=Math.min(o.clientY+14,innerHeight-130)+"px"});
map.on("mouseout dragstart",()=>tip.style.display="none");
const vb=document.getElementById("vars");for(const v in VARS){const b=document.createElement("button");b.textContent=VARS[v].n;b.className=v==cur?"on":"";b.onclick=()=>{cur=v;[...vb.children].forEach(c=>c.className="");b.className="on";paintAll()};vb.appendChild(b)}
const rb=document.getElementById("routes");for(const k in R){const l=document.createElement("label");l.className="row";l.innerHTML=`<input type="checkbox" checked><span style="width:10px;height:10px;border-radius:50%;background:${ROUTE_COL[k]}"></span>${NAMES[k]} <span style="color:var(--mut);font-size:12px">(${R[k].p.length} pts, ⌀ ${R[k].diam.toFixed(0)} m)</span>`;l.firstChild.onchange=e=>{active[k]=e.target.checked;const f=e.target.checked?"addTo":"remove";[R[k].ov,lineL[k]][0][f](map);if(showLines)lineL[k][f](map);else lineL[k].remove();if(showPts)ptL[k][f](map)}; rb.appendChild(l)}
document.getElementById("pow").oninput=e=>{power=+e.target.value;document.getElementById("pv").textContent=power;clearTimeout(window._t);window._t=setTimeout(rebuild,200)};
document.getElementById("op").oninput=e=>{opacity=+e.target.value;for(const k in R)R[k].ov&&R[k].ov.setOpacity(opacity)};
document.getElementById("lines").onchange=e=>{showLines=e.target.checked;for(const k in R)(showLines&&active[k])?lineL[k].addTo(map):lineL[k].remove()};
document.getElementById("pts").onchange=e=>{showPts=e.target.checked;for(const k in R)(showPts&&active[k])?ptL[k].addTo(map):ptL[k].remove()};
document.getElementById("stats").innerHTML="Every cell inside a loop is interpolated from <b>all</b> points of that loop, so values are spread across the full width of the route (up to <b>"+Math.round(Math.max(...Object.values(R).map(r=>r.diam)))+" m</b> between opposite points). Hover for values.";
rebuild();
</script></body></html>
